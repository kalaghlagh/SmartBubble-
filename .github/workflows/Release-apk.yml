name: Release APK

# Builds the signed release APK.
#  - Push a tag like v1.0.0  -> build, test, sign, and publish a GitHub Release with the APK.
#  - Run manually            -> build, test, sign, and upload the APK as a workflow artifact.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64  base64 of the upload keystore (.jks). The key alias must be "upload"
#                    (fixed in app/build.gradle.kts).   base64 -w0 my-upload-key.jks
#   STORE_PASSWORD   keystore password
#   KEY_PASSWORD     password of the "upload" key

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests before building"
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release on tag builds

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 9.1.1 needs JDK 17+. The app itself targets Java 11 bytecode (compileOptions).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Validates gradle-wrapper.jar and caches Gradle. The wrapper pins Gradle 9.3.1 and
      # verifies the distribution checksum (gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK with licenses accepted; AGP downloads the
      # compileSdk platform (36.1) and build-tools on demand.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ]  || missing="$missing STORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ]    || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. The release APK cannot be signed."
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias upload > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with STORE_PASSWORD, or it has no key with alias 'upload'."
            exit 1
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify and name the APK
        id: apk
        run: |
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$src" ]; then
            echo "::error::Expected APK not found at $src"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$src"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then label="$GITHUB_REF_NAME"; else label="${GITHUB_SHA::7}"; fi
          out="$RUNNER_TEMP/SmartBubble-$label.apk"
          cp "$src" "$out"
          ( cd "$RUNNER_TEMP" && sha256sum "SmartBubble-$label.apk" > "SmartBubble-$label.apk.sha256" )
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$out.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartBubble-release-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.sha }}
          if-no-files-found: error

      # Room exports the database schema during the build. Commit this JSON to app/schemas
      # so future migrations can be verified against it.
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.sha }}" \
            --title "SmartBubble $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
