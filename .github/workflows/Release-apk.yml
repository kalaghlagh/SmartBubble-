name: Release APK

# Builds SmartBubble on demand. Nothing is published: all outputs are workflow artifacts.
#
#   Always ............ Debug APK, uploaded whenever the Debug build itself succeeds, also when
#                       tests or lint fail (a diagnostic build for real-device testing). Its
#                       artifact name says whether the checks passed:
#                         SmartBubble-Debug-<sha>-run<N>                        all checks passed
#                         SmartBubble-Debug-<sha>-run<N>-UNVERIFIED-checks-failed  a check failed
#                         SmartBubble-Debug-<sha>-run<N>-UNVERIFIED-tests-not-run  tests not requested
#                       Failing checks still make the run red. If the build fails, its log is
#                       uploaded instead and the summary says that no APK exists.
#   When authorized ... unit tests (manual input `run_tests`, or repository variable
#                       RUN_UNIT_TESTS = true)
#   When signing secrets are configured ... signed release APK and AAB (only when the build and
#                       every check that ran succeeded; unchanged)
#
# Triggers: manual run (Actions tab > Release APK > Run workflow) or pushing a tag `v*`.
# There is deliberately no push / pull-request trigger.
#
# Signing secrets (Settings > Secrets and variables > Actions > New repository secret):
#   KEYSTORE_BASE64  the release keystore (.jks), base64-encoded:  base64 -w0 release.jks
#   STORE_PASSWORD   password of the keystore
#   KEY_PASSWORD     password of the signing key
# The signing key alias is "smartbubble": KEY_ALIAS below is the single place it is set for this
# workflow. The keystore check and Gradle (app/build.gradle.kts) both read that one value, and
# the built APK's certificate is compared with that key before anything is uploaded.
# Never commit the keystore or the passwords. Without the secrets the release build is skipped
# and reported as skipped; no unsigned or test-signed file is presented as a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests"
        type: boolean
        default: false
      version_name:
        description: "Release versionName (default: tag without the leading v, or 1.0)"
        type: string
        required: false
      version_code:
        description: "Release versionCode (default: the workflow run number)"
        type: string
        required: false

permissions:
  contents: read

env:
  # Alias of the signing key inside the keystore (not a secret). Fixed here on purpose: no
  # repository variable or default elsewhere can change which key is validated and used.
  KEY_ALIAS: smartbubble

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 9.1.1 needs JDK 17+. The app itself compiles to Java 11 bytecode.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the command-line tools and accepts the SDK licenses. AGP then downloads the
      # compileSdk platform (36.1) and the build-tools it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Validates gradle/wrapper/gradle-wrapper.jar and caches Gradle. The wrapper pins
      # Gradle 9.3.1 and verifies the distribution checksum.
      - name: Set up Gradle (validates the wrapper)
        uses: gradle/actions/setup-gradle@v4

      # Identity of this build: every artifact name and build-info.txt carry the source commit.
      - name: Resolve build identity
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Building commit $GITHUB_SHA ($GITHUB_REF_NAME), run $GITHUB_RUN_NUMBER."

      - name: Build debug APK
        id: build_debug
        shell: bash
        run: |
          set -o pipefail
          # Never package or upload a leftover APK: start from an empty output folder.
          rm -rf app/build/outputs/apk/debug
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/assemble-debug.log"

      # The build failed: there is no APK; keep the build log (Gradle output only, no secrets:
      # the Debug build uses no signing secrets).
      - name: Upload Debug build log
        if: ${{ failure() && steps.build_debug.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-log-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: ${{ runner.temp }}/assemble-debug.log
          if-no-files-found: warn

      # Tests run BEFORE the APK is uploaded: a red run publishes no APK.
      - name: Run unit tests
        id: unit_tests
        if: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Summarize unit test results
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          lines = []
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              suite = ET.parse(path).getroot()
              t, f, e, s = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; failed += f + e; skipped += s
              lines.append(f"{suite.get('name')}: {t} tests, {f + e} failed, {s} skipped")
              for case in suite.iter("testcase"):
                  name = f"{suite.get('name')}.{case.get('name')}"
                  if case.find("skipped") is not None:
                      lines.append(f"  SKIPPED {name}: {(case.find('skipped').get('message') or '')[:200]}")
                  for bad in ("failure", "error"):
                      if case.find(bad) is not None:
                          lines.append(f"  FAILED {name}: {(case.find(bad).get('message') or '')[:300]}")
                          # The whole failure message (it may carry diagnostics) and the first stack frames.
                          trace = [l for l in (case.find(bad).text or "").splitlines() if l.strip()]
                          first_at = next((i for i, l in enumerate(trace) if l.lstrip().startswith("at ")), len(trace))
                          shown = trace[:min(first_at, 400)] + trace[first_at:first_at + 6]
                          lines.extend("      " + l.rstrip() for l in shown)
          print("\n".join(lines))
          print(f"TOTAL: {total} tests, {failed} failed, {skipped} skipped")

      - name: Upload unit test reports
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Screenshots of the running app drawn by ThesisAppFlowTest (Robolectric, not a device).
      - name: Upload Thesis Builder screenshots
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: thesis-screenshots-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: app/build/thesis-screenshots/
          if-no-files-found: warn

      # Every instrumented test (app/src/androidTest) on a real Android runtime (emulator, API 34):
      # the section editor with real selections and clipboard content, every destination in
      # EN/FR/AR, template import and preview, Thesis DOCX/PDF export (PDF rendered on the device),
      # and initialization of every app class on ART. Keeps the logcat (with any FATAL EXCEPTION)
      # and screenshots. Runs with the unit tests; a failure or crash publishes no APK.
      - name: Enable KVM for the emulator
        if: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build instrumented test APK
        id: build_test_apk
        if: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Run instrumented tests on an Android emulator
        id: device_tests
        if: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh

      - name: Summarize device test results
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        run: |
          d=device-test-output
          [ -d "$d" ] || { echo "No device test output."; exit 0; }
          echo "== Android"; cat "$d/android-version.txt" || true
          echo "== Results"; grep -E "^OK \(|^FAILURES|^Tests run|INSTRUMENTATION_STATUS: (class|test)=|INSTRUMENTATION_STATUS_CODE: -|Process crashed" "$d/instrument.txt" | head -300 || true
          # Full message and first frames of every failed test (the "stack=" block of am instrument).
          echo "== Failures"; awk '/INSTRUMENTATION_STATUS: stack=/{p=1;n=0} /INSTRUMENTATION_STATUS: (current|id|numtests)=/{p=0} p&&n<60{print;n++}' "$d/instrument.txt" | head -600 || true
          echo "== Focus before the tests"; cat "$d/window-focus-start.txt" 2>/dev/null || true
          echo "== ANRs during the run (any app)"; cat "$d/anrs.txt" 2>/dev/null | head -40 || true
          echo "== Window focus at the end"; cat "$d/window-focus.txt" 2>/dev/null || true
          # Focus changes around every editor test (full timeline in the artifact).
          echo "== Focus timeline (editor tests)"; awk '/TestRunner: started: .*ThesisEditorDeviceTest/{p=1} p' "$d/focus-timeline.txt" 2>/dev/null | grep -v "Denying clipboard" | head -500 || true
          echo "== Clipboard / editor / file / ANR events"; cat "$d/app-events.txt" 2>/dev/null | head -150 || true
          echo "== FATAL EXCEPTIONS"; cat "$d/fatal-exceptions.txt" 2>/dev/null | head -300 || true

      - name: Upload device test evidence (logcat, screenshots)
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: device-tests-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: device-test-output/
          if-no-files-found: warn

      # Android lint: API calls above minSdk 24 (NewApi), wrong resources, missing translations and
      # other Android-only errors the JVM tests cannot see. Errors fail the run.
      - name: Android lint
        id: lint
        # Runs even when an earlier test step failed, so every run reports its lint errors too.
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        run: ./gradlew lintDebug --stacktrace

      - name: Summarize lint results
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          from collections import Counter
          for path in glob.glob("app/build/reports/lint-results-debug.xml") or glob.glob("app/build/**/lint-results*.xml", recursive=True):
              issues = ET.parse(path).getroot().findall("issue")
              print(path, Counter((i.get("severity"), i.get("id")) for i in issues).most_common())
              for i in issues:
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else "?"
                      print(f"ERROR {i.get('id')}: {where}: {i.get('message')}")

      - name: Upload lint report
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Uploaded whenever the Debug build succeeded, after the checks, whatever their result: a
      # diagnostic APK for real-device testing. Its name and CI-STATUS.txt say whether the checks
      # passed; failed checks keep the run red. The APK must have been built in this run from
      # this commit: its versionName carries the commit.
      - name: Verify debug APK
        id: debug_apk
        if: ${{ always() && steps.build_debug.outcome == 'success' }}
        env:
          TESTS_REQUESTED: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
          UNIT: ${{ steps.unit_tests.outcome }}
          TEST_APK: ${{ steps.build_test_apk.outcome }}
          DEVICE: ${{ steps.device_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Expected exactly one debug APK, found ${#apks[@]}."; exit 1; }
          apk="${apks[0]}"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          badging="$("$aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          version="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          case "$version" in
            *"+$SHORT_SHA") ;;
            *) echo "::error::The debug APK versionName '$version' does not carry commit $SHORT_SHA: not built from this commit."; exit 1;;
          esac
          # Status of the checks in this run.
          if [ "$TESTS_REQUESTED" != "true" ]; then
            status="tests-not-run"; label="UNVERIFIED: tests and lint were not run for this build."
          elif [ "$UNIT" = "success" ] && [ "$TEST_APK" = "success" ] && [ "$DEVICE" = "success" ] && [ "$LINT" = "success" ]; then
            status="verified"; label="All CI checks passed (unit tests, emulator tests, lint). Not yet tested on a physical phone."
          else
            status="checks-failed"; label="UNVERIFIED, POTENTIALLY UNSTABLE: CI checks failed (unit=$UNIT, test-apk=$TEST_APK, emulator=$DEVICE, lint=$LINT). Diagnostic build for real-device testing only."
          fi
          name="SmartBubble-Debug-$SHORT_SHA-run$GITHUB_RUN_NUMBER"
          [ "$status" = "verified" ] || name="$name-UNVERIFIED-$status"
          out="$RUNNER_TEMP/debug"
          rm -rf "$out"; mkdir -p "$out"
          cp "$apk" "$out/$name.apk"
          {
            echo "build_type=Debug"
            echo "source_commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version_name=$version"
            echo "apk_sha256=$(sha256sum "$out/$name.apk" | cut -d' ' -f1)"
            echo "ci_status=$status"
          } > "$out/build-info.txt"
          {
            echo "$label"
            echo "unit_tests=${UNIT:-skipped}"
            echo "instrumented_test_apk=${TEST_APK:-skipped}"
            echo "emulator_tests=${DEVICE:-skipped}"
            echo "lint=${LINT:-skipped}"
            echo "Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$out/CI-STATUS.txt"
          cat "$out/build-info.txt" "$out/CI-STATUS.txt"
          echo "DEBUG_DIR=$out" >> "$GITHUB_ENV"
          echo "DEBUG_ARTIFACT=$name" >> "$GITHUB_ENV"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = "verified" ] || echo "::warning::Debug APK $name is UNVERIFIED ($status): diagnostic build, potentially unstable."

      - name: Upload debug APK
        if: ${{ always() && steps.debug_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEBUG_ARTIFACT }}
          path: ${{ env.DEBUG_DIR }}
          if-no-files-found: error

      # One overview of the run in the job summary: APK, every check, failed tests and lint errors.
      - name: CI summary
        if: ${{ always() }}
        shell: python3 {0}
        env:
          BUILD: ${{ steps.build_debug.outcome }}
          APK_STEP: ${{ steps.debug_apk.outcome }}
          APK_STATUS: ${{ steps.debug_apk.outputs.status }}
          UNIT: ${{ steps.unit_tests.outcome }}
          TEST_APK: ${{ steps.build_test_apk.outcome }}
          DEVICE: ${{ steps.device_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          import glob, os, re, xml.etree.ElementTree as ET
          e = os.environ
          def st(v): return {"success": "passed", "failure": "FAILED", "cancelled": "cancelled", "skipped": "not run", "": "not run"}.get(v or "", v)
          out = ["## Smart Bubble CI summary", "", "| Item | Result |", "|---|---|"]
          out.append(f"| Debug APK build | {st(e.get('BUILD'))} |")
          if e.get("APK_STEP") == "success":
              art = e.get("DEBUG_ARTIFACT", "")
              out.append(f"| Debug APK artifact | `{art}` |")
              if e.get("APK_STATUS") != "verified":
                  out.append("| APK label | **UNVERIFIED, potentially unstable: diagnostic build for real-device testing** |")
          else:
              out.append("| Debug APK artifact | **No APK available** (the build failed; see debug-build-log artifact) |")
          out += [f"| Unit tests | {st(e.get('UNIT'))} |", f"| Instrumented test APK | {st(e.get('TEST_APK'))} |",
                  f"| Emulator tests | {st(e.get('DEVICE'))} |", f"| Lint | {st(e.get('LINT'))} |", ""]
          fails = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in ("failure", "error"):
                      n = case.find(bad)
                      if n is not None:
                          fails.append(f"Unit: {case.get('classname')}.{case.get('name')}: {(n.get('message') or '').splitlines()[0][:200] if n.get('message') else ''}")
          try:
              lines = open("device-test-output/instrument.txt", encoding="utf-8", errors="replace").read().splitlines()
              for i, l in enumerate(lines):
                  m = re.match(r"Error in (\S+)\((\S+)\):", l)
                  if m and i + 1 < len(lines):
                      fails.append(f"Emulator: {m.group(2)}.{m.group(1)}: {lines[i + 1][:200]}")
          except FileNotFoundError:
              pass
          for path in glob.glob("app/build/reports/lint-results-debug.xml"):
              for i in ET.parse(path).getroot().findall("issue"):
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = f"{os.path.relpath(loc.get('file'))}:{loc.get('line')}" if loc is not None else "?"
                      fails.append(f"Lint {i.get('id')}: {where}: {i.get('message')[:200]}")
          if fails:
              out += ["### Failures", ""] + [f"- {f}" for f in fails[:80]]
          text = "\n".join(out) + "\n"
          print(text)
          with open(e["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)

      # Room writes the database schema during the build. Commit it to app/schemas.
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured: the release APK/AAB build was skipped."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release-key.jks"
          probe="$RUNNER_TEMP/keystore-probe.p12"
          log="$RUNNER_TEMP/keytool.log"
          cleanup() { rm -f "$probe" "$log"; }
          fail() { rm -f "$keystore"; cleanup; echo "::error::$1"; exit 1; }

          # 1. Decode. Line breaks or spaces in the secret are tolerated.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2> /dev/null \
              || [ ! -s "$keystore" ]; then
            fail "KEYSTORE_BASE64 is not valid base64. Recreate the secret with: base64 -w0 <keystore file>"
          fi

          # Passwords are passed to keytool through the environment (":env"), never on the
          # command line, and keytool output is kept out of the log.

          # 2. The keystore opens with STORE_PASSWORD.
          if ! keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD > "$log" 2>&1; then
            if grep -qi "password was incorrect" "$log"; then
              fail "The keystore cannot be opened: the STORE_PASSWORD secret does not match this keystore. Correct the STORE_PASSWORD secret."
            fi
            fail "The decoded KEYSTORE_BASE64 is not a readable keystore (JKS or PKCS12). Re-encode the original keystore file."
          fi

          # 3. The alias exists and is a private key.
          if ! keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > "$log" 2>&1; then
            fail "The keystore has no entry with the alias '$KEY_ALIAS'. The keystore in KEYSTORE_BASE64 is not the expected release keystore."
          fi
          if ! grep -q "PrivateKeyEntry" "$log"; then
            fail "The alias '$KEY_ALIAS' is not a private key entry, so it cannot sign the app."
          fi

          # 4. The private key can be read with KEY_PASSWORD (copied to a throwaway keystore
          #    that is deleted immediately; the original keystore is not modified).
          if ! keytool -importkeystore -noprompt \
              -srckeystore "$keystore" -srcstorepass:env STORE_PASSWORD \
              -srcalias "$KEY_ALIAS" -srckeypass:env KEY_PASSWORD \
              -destkeystore "$probe" -deststoretype PKCS12 \
              -deststorepass:env STORE_PASSWORD -destkeypass:env STORE_PASSWORD > "$log" 2>&1; then
            fail "The private key '$KEY_ALIAS' cannot be accessed: the KEY_PASSWORD secret does not match this key. Correct the KEY_PASSWORD secret."
          fi
          cleanup
          echo "Keystore verified: alias '$KEY_ALIAS' is present and its private key is accessible."
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          name="$INPUT_VERSION_NAME"
          if [ -z "$name" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then name="${GITHUB_REF_NAME#v}"; fi
          code="$INPUT_VERSION_CODE"
          if [ -z "$code" ]; then code="$GITHUB_RUN_NUMBER"; fi
          case "$code" in ''|*[!0-9]*) echo "::error::version_code must be a positive integer."; exit 1;; esac
          echo "VERSION_NAME=${name:-1.0}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signatures
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          [ -s "$apk" ] || { echo "::error::Release APK not found at $apk"; exit 1; }
          [ -s "$aab" ] || { echo "::error::Release AAB not found at $aab"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
          jarsigner -verify "$aab" > /dev/null
          # The APK must be signed by the key that was validated above (alias $KEY_ALIAS).
          # Certificate fingerprints are public values, not secrets.
          expected="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          actual="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-certs.txt" | awk '{print $NF}')"
          rm -f "$RUNNER_TEMP/apk-certs.txt"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::The release APK is not signed with the '$KEY_ALIAS' key from the keystore."
            exit 1
          fi
          echo "Release APK is signed with the '$KEY_ALIAS' key (certificate SHA-256 $actual)."
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$apk" "$out/SmartBubble-$VERSION_NAME-$VERSION_CODE-$SHORT_SHA.apk"
          cp "$aab" "$out/SmartBubble-$VERSION_NAME-$VERSION_CODE-$SHORT_SHA.aab"
          ( cd "$out" && sha256sum SmartBubble-* > SHA256SUMS.txt )
          printf 'source_commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$out/build-info.txt"
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - name: Upload signed release artifacts
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartBubble-release-signed-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release-key.jks" "$RUNNER_TEMP/keystore-probe.p12" "$RUNNER_TEMP/keytool.log"
