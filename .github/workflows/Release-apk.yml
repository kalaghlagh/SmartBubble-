name: Release APK

# Builds SmartBubble on demand. Nothing is published: all outputs are workflow artifacts.
#
#   Always ............ debug APK
#   When authorized ... unit tests (manual input `run_tests`, or repository variable
#                       RUN_UNIT_TESTS = true)
#   When signing secrets are configured ... signed release APK and AAB
#
# Triggers: manual run (Actions tab > Release APK > Run workflow) or pushing a tag `v*`.
# There is deliberately no push / pull-request trigger.
#
# Signing secrets (Settings > Secrets and variables > Actions > New repository secret):
#   KEYSTORE_BASE64  the upload keystore, base64-encoded:  base64 -w0 my-upload-key.jks
#                    The key alias inside it must be "upload" (fixed in app/build.gradle.kts).
#   STORE_PASSWORD   password of the keystore
#   KEY_PASSWORD     password of the "upload" key
# Never commit the keystore or the passwords. Without the secrets the release build is skipped
# and reported as skipped; no unsigned or test-signed file is presented as a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests"
        type: boolean
        default: false
      version_name:
        description: "Release versionName (default: tag without the leading v, or 1.0)"
        type: string
        required: false
      version_code:
        description: "Release versionCode (default: the workflow run number)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 9.1.1 needs JDK 17+. The app itself compiles to Java 11 bytecode.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the command-line tools and accepts the SDK licenses. AGP then downloads the
      # compileSdk platform (36.1) and the build-tools it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Validates gradle/wrapper/gradle-wrapper.jar and caches Gradle. The wrapper pins
      # Gradle 9.3.1 and verifies the distribution checksum.
      - name: Set up Gradle (validates the wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBubble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        if: ${{ inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true' }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: ${{ always() && (inputs.run_tests == true || vars.RUN_UNIT_TESTS == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Room writes the database schema during the build. Commit it to app/schemas.
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured: the release APK/AAB build was skipped."
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias upload > /dev/null 2>&1; then
            rm -f "$keystore"
            echo "::error::The keystore cannot be opened with STORE_PASSWORD, or it has no key with the alias 'upload'."
            exit 1
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          name="$INPUT_VERSION_NAME"
          if [ -z "$name" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then name="${GITHUB_REF_NAME#v}"; fi
          code="$INPUT_VERSION_CODE"
          if [ -z "$code" ]; then code="$GITHUB_RUN_NUMBER"; fi
          case "$code" in ''|*[!0-9]*) echo "::error::version_code must be a positive integer."; exit 1;; esac
          echo "VERSION_NAME=${name:-1.0}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release signatures
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          [ -s "$apk" ] || { echo "::error::Release APK not found at $apk"; exit 1; }
          [ -s "$aab" ] || { echo "::error::Release AAB not found at $aab"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          jarsigner -verify "$aab" > /dev/null
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$apk" "$out/SmartBubble-$VERSION_NAME-$VERSION_CODE.apk"
          cp "$aab" "$out/SmartBubble-$VERSION_NAME-$VERSION_CODE.aab"
          ( cd "$out" && sha256sum SmartBubble-* > SHA256SUMS.txt )
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - name: Upload signed release artifacts
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartBubble-release-signed
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
